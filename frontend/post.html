<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- post.js cambia el título por el de la entrada -->
    <title>MAC.LOG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<!-- data-page="post": ningún link de la nav queda marcado como activo -->
<body data-page="post" class="scanlines bg-crt-bg text-cream font-mono antialiased">

    <!-- Mismo layout de 3 columnas que index.html (ver comentarios allá) -->
    <div class="min-h-screen lg:grid lg:grid-cols-[13rem_minmax(0,1fr)_16rem]">

        <header id="site-nav"
            class="border-b-2 border-phosphor/40 lg:border-b-0 lg:border-r-2 lg:sticky lg:top-0 lg:h-screen lg:self-start">
        </header>

        <main class="px-4 py-8 sm:px-8 lg:px-12 lg:py-12">
            <div class="max-w-2xl mx-auto">

                <a href="index.html" class="font-pixel text-xl text-phosphor hover:bg-phosphor hover:text-crt-bg px-1">
                    ◂ VOLVER
                </a>

                <!-- post.js pinta aquí la entrada completa (o el 404) -->
                <article id="post" class="mt-6">
                    <p class="font-pixel text-2xl text-phosphor cursor">CARGANDO</p>
                </article>

                <footer class="mt-16 pt-4 border-t border-phosphor/30 text-xs text-phosphor-dim">
                    © 2026 MAC
                </footer>
            </div>
        </main>

        <aside id="archive" aria-label="Archivo del blog"
            class="px-4 pb-8 sm:px-8 lg:px-4 lg:py-12 lg:sticky lg:top-0 lg:h-screen lg:self-start lg:overflow-y-auto lg:border-l-2 lg:border-phosphor/40">
        </aside>
    </div>

    <script src="js/data.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/post.js" defer></script>
</body>

</html>
